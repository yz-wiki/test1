# =============================================================================
# windows-verify.yml — Windows 前端/后端编译校验(按需)
#
# 触发:仅 Actions 页面手动 Run workflow(workflow_dispatch)。
# 背景(沿用上游注释):仓库不在线提供 VLC 链接/运行时(vlc-dist/ 为 git-ignored,
# 需先由 scripts/stage-windows-runtime.ps1 现场暂存),因此这里只跑"无需链接
# LibVLC"的校验:clippy 以 check 语义编译所有 crate 与 #[cfg(windows)] 分支,
# 证明 Windows 专属代码在改动后仍能编译。完整安装包/便携包请用
# build-windows.yml(已包含运行时暂存步骤)。
#
# 日志:每个校验命令独立 step 并 Tee 到 .gha-logs/,失败/成功都会上传 artifact,
# 方便在云端定位具体是哪一条命令、哪一个文件报错。
# =============================================================================

name: Windows 校验(按需)

on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CI: "true"

jobs:
  verify:
    name: Windows 编译校验
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 0 · 检出代码
        uses: actions/checkout@v4

      - name: 1 · 环境信息
        run: |
          Write-Host "::group::环境信息"
          Write-Host "操作系统 = $([System.Environment]::OSVersion.VersionString)"
          rustc --version
          cargo --version
          Write-Host "::endgroup::"

      - name: 2 · Rust stable(含 clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 3 · pnpm 10 + Node.js 22
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4 · pnpm install(冻结 lockfile)
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.gha-logs" | Out-Null
          & pnpm install --frozen-lockfile 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.gha-logs\04-pnpm-install.log"
          exit $LASTEXITCODE

      - name: 5 · 前端类型检查(tsc)
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.gha-logs" | Out-Null
          & pnpm typecheck 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.gha-logs\05-typecheck.log"
          exit $LASTEXITCODE

      - name: 6 · 前端单元测试(vitest)
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.gha-logs" | Out-Null
          & pnpm test:front 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.gha-logs\06-front-tests.log"
          exit $LASTEXITCODE

      - name: 7 · Tauri 命令一致性校验
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.gha-logs" | Out-Null
          & pnpm verify:commands 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.gha-logs\07-verify-commands.log"
          exit $LASTEXITCODE

      - name: 8 · console.* 使用校验
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.gha-logs" | Out-Null
          & pnpm verify:console 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.gha-logs\08-verify-console.log"
          exit $LASTEXITCODE

      # clippy 以 check 语义编译(不链接 LibVLC),覆盖 #[cfg(windows)] 代码。
      - name: 9 · Rust clippy(Windows 分支编译校验)
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.gha-logs" | Out-Null
          & pnpm verify:clippy 2>&1 |
              Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.gha-logs\09-clippy.log"
          exit $LASTEXITCODE

      - name: 10 · 上传校验日志(成功/失败都会上传)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skald-verify-logs-${{ github.run_id }}
          path: .gha-logs
          if-no-files-found: ignore
          retention-days: 14
